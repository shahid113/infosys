<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infosys CodePrep Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              easy: '#22c55e',
              medium: '#eab308',
              hard: '#ef4444',
              bg: '#18181b',
              card: '#27272a',
              accent: '#3f3f46'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans antialiased selection:bg-blue-600 selection:text-white">

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-900/80 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-blue-600/20 text-blue-400 rounded-lg border border-blue-500/30 font-bold">
          &lt;/&gt;
        </div>
        <div>
          <h1 class="font-bold text-lg leading-none text-zinc-100">Infosys CodePrep</h1>
          <p class="text-xs text-zinc-400 mt-1">Curated Interview Question Tracker</p>
        </div>
      </div>
      <button id="reset-btn" class="px-3 py-1.5 text-xs text-zinc-400 hover:text-red-400 border border-zinc-700 hover:border-red-500/50 rounded-md transition-all">
        Reset Progress
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <!-- Overall Statistics Card -->
    <section class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <!-- Main Progress -->
      <div class="md:col-span-1 bg-zinc-900 border border-zinc-800 rounded-xl p-5 flex flex-col justify-between">
        <div>
          <span class="text-xs uppercase tracking-wider text-zinc-500 font-semibold">Total Progress</span>
          <div class="flex items-baseline space-x-2 mt-2">
            <span id="solved-count" class="text-3xl font-extrabold text-white">0</span>
            <span class="text-zinc-500 text-sm">/ <span id="total-count">0</span> Solved</span>
          </div>
        </div>
        <div class="mt-4">
          <div class="flex justify-between text-xs text-zinc-400 mb-1">
            <span>Completion</span>
            <span id="progress-percent">0%</span>
          </div>
          <div class="w-full bg-zinc-800 h-2.5 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-blue-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <!-- Difficulty Breakdown -->
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 flex flex-col justify-between">
        <div class="flex justify-between items-center">
          <span class="text-xs uppercase tracking-wider text-green-500 font-semibold">Easy</span>
          <span id="easy-ratio" class="text-xs text-zinc-400">0/0</span>
        </div>
        <div class="text-2xl font-bold text-zinc-100 mt-2" id="easy-count">0</div>
        <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden mt-3">
          <div id="easy-bar" class="bg-green-500 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 flex flex-col justify-between">
        <div class="flex justify-between items-center">
          <span class="text-xs uppercase tracking-wider text-yellow-500 font-semibold">Medium</span>
          <span id="medium-ratio" class="text-xs text-zinc-400">0/0</span>
        </div>
        <div class="text-2xl font-bold text-zinc-100 mt-2" id="medium-count">0</div>
        <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden mt-3">
          <div id="medium-bar" class="bg-yellow-500 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 flex flex-col justify-between">
        <div class="flex justify-between items-center">
          <span class="text-xs uppercase tracking-wider text-red-500 font-semibold">Hard</span>
          <span id="hard-ratio" class="text-xs text-zinc-400">0/0</span>
        </div>
        <div class="text-2xl font-bold text-zinc-100 mt-2" id="hard-count">0</div>
        <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden mt-3">
          <div id="hard-bar" class="bg-red-500 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </section>

    <!-- Filters & Search Toolbar -->
    <section class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col md:flex-row gap-4 justify-between items-center">
      <!-- Search -->
      <div class="w-full md:w-80 relative">
        <input type="text" id="search-input" placeholder="Search question or tag..." 
          class="w-full bg-zinc-950 border border-zinc-800 text-sm rounded-lg px-4 py-2 text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-blue-500">
      </div>

      <!-- Select Dropdowns -->
      <div class="flex flex-wrap gap-3 w-full md:w-auto">
        <select id="category-filter" class="bg-zinc-950 border border-zinc-800 text-xs rounded-lg px-3 py-2 text-zinc-300 focus:outline-none focus:border-blue-500">
          <option value="ALL">All Primary Topics</option>
        </select>

        <select id="difficulty-filter" class="bg-zinc-950 border border-zinc-800 text-xs rounded-lg px-3 py-2 text-zinc-300 focus:outline-none focus:border-blue-500">
          <option value="ALL">All Difficulties</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>

        <select id="status-filter" class="bg-zinc-950 border border-zinc-800 text-xs rounded-lg px-3 py-2 text-zinc-300 focus:outline-none focus:border-blue-500">
          <option value="ALL">All Status</option>
          <option value="SOLVED">Solved</option>
          <option value="UNSOLVED">Unsolved</option>
        </select>
      </div>
    </section>

    <!-- Question Table -->
    <section class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-zinc-400">
          <thead class="bg-zinc-950/60 text-xs uppercase tracking-wider text-zinc-500 border-b border-zinc-800">
            <tr>
              <th scope="col" class="py-3 px-4 w-12 text-center">Status</th>
              <th scope="col" class="py-3 px-4">Title</th>
              <th scope="col" class="py-3 px-4">Infosys Primary Topic</th>
              <th scope="col" class="py-3 px-4 w-28">Difficulty</th>
              <th scope="col" class="py-3 px-4">Tags</th>
            </tr>
          </thead>
          <tbody id="question-table-body" class="divide-y divide-zinc-800/60">
            <!-- Questions rendered via JS -->
          </tbody>
        </table>
      </div>
      <div id="no-results" class="hidden p-8 text-center text-zinc-500">
        No questions match your current filters.
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
